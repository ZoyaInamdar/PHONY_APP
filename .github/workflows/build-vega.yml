name: Build Vega OS App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Note: Vega's templates assume npm or Yarn. If you use pnpm, 
      # the CLI expects a flat node_modules, so you would need node-linker=hoisted.
      - name: Install Dependencies
        run: npm install

      # Install the official Amazon Vega CLI and SDK on the Ubuntu runner
      - name: Install Vega CLI and SDK
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o get_vvm.sh
          sed -i 's/run_vega_sdk_command sdk config setup/printf "\\n" | run_vega_sdk_command sdk config setup/' get_vvm.sh
          chmod +x get_vvm.sh
          NONINTERACTIVE=true yes "" | bash get_vvm.sh
          echo "$HOME/vega/bin" >> $GITHUB_PATH
          if [ -f "$HOME/vega/env" ]; then
            source "$HOME/vega/env"
            if [ -n "$KEPLER_SDK_PATH" ]; then
              echo "KEPLER_SDK_PATH=$KEPLER_SDK_PATH" >> $GITHUB_ENV
            fi
          fi
          if [ -z "$KEPLER_SDK_PATH" ] && [ -d "$HOME/vega/sdk" ]; then
            LATEST_SDK=$(ls -d $HOME/vega/sdk/* 2>/dev/null | tail -n 1)
            if [ -n "$LATEST_SDK" ]; then
              echo "KEPLER_SDK_PATH=$LATEST_SDK" >> $GITHUB_ENV
            fi
          fi

      - name: Verify Vega CLI and SDK
        run: |
          which vega || true
          vega --version || true
          echo "KEPLER_SDK_PATH: $KEPLER_SDK_PATH"
          if command -v vega >/dev/null 2>&1; then
            vega sdk list-installed || true
          fi

      # Build the app using the command we set in package.json
      # On Ubuntu (x86_64), this will generate a vpkg named like: build/x86_64-release/<appname>_x86_64.vpkg
      - name: Build VPKG
        run: npm run build:app

      - name: Upload VPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-app-package
          # The build directory structure depends on the architecture. 
          # We use a wildcard to grab the generated package.
          path: |
            build/**/*release/*.vpkg
            build/**/*.vpkg

